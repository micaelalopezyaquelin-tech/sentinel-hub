<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>The Neon Archive 🛰️</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <style>
        :root {
            --bg: #05030a;
            --panel: rgba(13, 10, 28, 0.9);
            --border: rgba(139, 233, 253, 0.15);
            --cyan: #8be9fd;
            --magenta: #ff79c6;
            --green: #50fa7b;
            --yellow: #f1fa8c;
            --text: #f8f8f2;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 15px 15px 60px 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box; overflow-x: hidden;
        }

        /* HEADER & STATUS */
        .hud-header {
            width: 100%; max-width: 460px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 12px; margin-bottom: 15px; box-sizing: border-box;
            display: flex; justify-content: space-between; font-size: 0.75em; font-weight: bold;
        }

        /* INSTAGRAM STORIES FUSION */
        .stories-container {
            width: 100%; max-width: 460px; display: flex; gap: 15px;
            overflow-x: auto; padding: 10px 5px; margin-bottom: 15px; box-sizing: border-box;
        }
        .story-ring {
            flex: 0 0 auto; width: 70px; text-align: center; cursor: pointer;
        }
        .story-avatar {
            width: 60px; height: 60px; border-radius: 50%; 
            border: 2px solid var(--magenta); display: flex; align-items: center; 
            justify-content: center; font-size: 1.6em; background: #120f26;
            box-shadow: 0 0 10px rgba(255, 121, 198, 0.2); transition: transform 0.2s;
        }
        .story-ring.locked .story-avatar {
            border-color: #6272a4; filter: grayscale(1); box-shadow: none;
        }
        .story-label { font-size: 0.65em; margin-top: 5px; font-weight: bold; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* MODAL DE HISTORIAS / VISUALIZADOR */
        .archive-modal {
            display: none; position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: rgba(5,3,10,0.98); z-index: 10000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border);
            border-top: 3px solid var(--magenta); border-radius: 12px; padding: 25px; box-sizing: border-box; text-align: center;
        }

        /* NOTION MODULAR BOARD */
        .notion-board {
            width: 100%; max-width: 460px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-sizing: border-box;
        }
        .board-title { font-size: 0.85em; color: var(--cyan); font-weight: bold; border-bottom: 1px dashed var(--border); padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        
        .note-block {
            background: rgba(0,0,0,0.4); border-left: 3px solid var(--green);
            padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 0.85em;
            display: flex; justify-content: space-between; align-items: center;
        }
        .note-block.done { border-left-color: #6272a4; opacity: 0.5; text-decoration: line-through; }
        
        /* ESCAPE ROOM INPUTS */
        .input-crypto {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            color: #fff; padding: 12px; border-radius: 8px; box-sizing: border-box;
            outline: none; font-family: inherit; margin: 15px 0; text-align: center;
        }
        .btn-crypto {
            background: linear-gradient(135deg, #181333, #0d0a1c); border: 1px solid var(--border);
            color: var(--cyan); padding: 12px; border-radius: 8px; width: 100%; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }

        /* INTERFAZ AUXILIAR */
        .btn-check { background: transparent; border: none; color: var(--green); font-size: 1.2em; cursor: pointer; }
        .input-add-note { width: calc(100% - 80px); background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-family: inherit; }
        .btn-add-note { width: 70px; background: var(--cyan); border: none; color: #000; padding: 10px; border-radius: 6px; font-family: inherit; font-weight: bold; cursor: pointer; margin-left: 5px;}

        /* ANIMACIÓN DE CORAZONES */
        .heart-fx { position: fixed; color: var(--magenta); font-size: 24px; animation: floatUp 1.5s forwards; pointer-events: none; z-index: 10001; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-80vh) translateX(var(--rx, 0px)) scale(1.4); opacity: 0; } }
    </style>
</head>
<body>

    <div class="hud-header">
        <span style="color: var(--green);" id="radar-txt">🟢 RED: EN LÍNEA</span>
        <span style="color: var(--yellow);" id="lvl-txt">RANGO: RECLUTA [LVL 1]</span>
    </div>

    <div class="stories-container" id="stories-wrapper">
        <div class="story-ring" onclick="abrirStory(1)">
            <div class="story-avatar">🛰️</div>
            <div class="story-label">Inicio</div>
        </div>
        <div class="story-ring locked" id="ring-s2" onclick="abrirStory(2)">
            <div class="story-avatar">🔒</div>
            <div class="story-label">Exp. 02</div>
        </div>
        <div class="story-ring locked" id="ring-s3" onclick="abrirStory(3)">
            <div class="story-avatar">🔒</div>
            <div class="story-label">Exp. 03</div>
        </div>
    </div>

    <div class="notion-board">
        <div class="board-title">📓 NOTION_CORE // TABLÓN DE MISIONES</div>
        <div id="notes-container"></div>
        <div style="display: flex; margin-top: 15px;">
            <input type="text" id="new-note-txt" class="input-add-note" placeholder="Nueva misión o nota...">
            <button class="btn-add-note" onclick="agregarNota()">+ ADD</button>
        </div>
    </div>

    <div class="archive-modal" id="archive-viewer">
        <div class="modal-content" id="modal-inside">
            </div>
    </div>

    <script>
        let xp = parseInt(localStorage.getItem('sentinel_xp') || "0");
        let s2_unlocked = localStorage.getItem('sentinel_s2') === 'true';
        let s3_unlocked = localStorage.getItem('sentinel_s3') === 'true';

        let notas = JSON.parse(localStorage.getItem('sentinel_notas') || '[{"id":1,"text":"Sincronizar canales con el Operador principal","done":false},{"id":2,"text":"Descifrar el Expediente 02 del búnker","done":false}]');

        // Render inicial de datos
        function actualizarHUD() {
            let lvl = Math.floor(xp / 100) + 1;
            document.getElementById('lvl-txt').innerText = `RANGO: AGENTE [LVL ${lvl}] (XP: ${xp % 100}/100)`;
            
            if(s2_unlocked) {
                document.getElementById('ring-s2').classList.remove('locked');
                document.getElementById('ring-s2').querySelector('.story-avatar').innerText = "📂";
            }
            if(s3_unlocked || lvl >= 2) {
                s3_unlocked = true;
                localStorage.setItem('sentinel_s3', 'true');
                document.getElementById('ring-s3').classList.remove('locked');
                document.getElementById('ring-s3').querySelector('.story-avatar').innerText = "💎";
            }
            renderNotas();
        }

        function ganarXP(cant) {
            xp += cant;
            localStorage.setItem('sentinel_xp', xp);
            actualizarHUD();
            fxCorazones();
        }

        // CONTROL DE STORIES E INTERACCIONES DE ESCAPE ROOM
        function abrirStory(id) {
            let viewer = document.getElementById('archive-viewer');
            let inside = document.getElementById('modal-inside');
            viewer.style.display = 'flex';

            if(id === 1) {
                inside.innerHTML = `
                    <div style="font-size:0.8em; color:var(--magenta); font-weight:bold; margin-bottom:10px;">📁 EXPEDIENTE #001 // MANUAL</div>
                    <p style="font-size:0.9em; text-align:left; line-height:1.4;">Bienvenido a la fusión táctica. En el tablón de abajo coordinarán sus misiones. Completen tareas para ganar XP y subir de rango. La Story 03 se abrirá sola al llegar a Nivel 2. ¡Suerte!</p>
                    <button class="btn-crypto" style="margin-top:15px;" onclick="cerrarViewer()">Cerrar Transmisión</button>
                `;
            } 
            else if(id === 2) {
                if(s2_unlocked) {
                    inside.innerHTML = `
                        <div style="font-size:0.8em; color:var(--green); font-weight:bold; margin-bottom:10px;">🔓 EXPEDIENTE #02 // ARCHIVO DESBLOQUEADO</div>
                        <p style="font-size:1.1em; color:var(--yellow); font-weight:bold; margin:20px 0;">"El destino no es una cuestión de azar, es una cuestión de elección."</p>
                        <p style="font-size:0.8em; color:#6272a4;">[ Archivo descifrado exitosamente por la alianza ]</p>
                        <button class="btn-crypto" style="margin-top:15px;" onclick="cerrarViewer()">Salir</button>
                    `;
                } else {
                    inside.innerHTML = `
                        <div style="font-size:0.8em; color:var(--magenta); font-weight:bold; margin-bottom:10px;">🔒 EXPEDIENTE #02 // ENCRIPTADO</div>
                        <p style="font-size:0.85em; text-align:left; background:rgba(0,0,0,0.3); padding:10px; border-radius:6px;"><b>Pista del Cifrado:</b> Rompecabezas clásico. Tiene ojos y no ve, tiene agua y no bebe, tiene carne y no come. ¿Qué fruta tropical es?</p>
                        <input type="text" id="crypto-sol" class="input-crypto" placeholder="Introduce la solución...">
                        <button class="btn-crypto" onclick="verificarAcertijo()">Descifrar Matriz 💻</button>
                        <button class="btn-crypto" style="background:transparent; border:none; margin-top:10px; color:#6272a4;" onclick="cerrarViewer()">Cancelar</button>
                    `;
                }
            }
            else if(id === 3) {
                if(s3_unlocked) {
                    inside.innerHTML = `
                        <div style="font-size:0.8em; color:var(--cyan); font-weight:bold; margin-bottom:10px;">💎 EXPEDIENTE #03 // NÚCLEO DE LA ALIANZA</div>
                        <p style="font-size:0.9em; text-align:left; line-height:1.4;">Has alcanzado el rango avanzado de operaciones. Este espacio almacena la cápsula del tiempo definitiva. Deja una nota en el Notion Notion de abajo para marcar tu legado el día de hoy.</p>
                        <button class="btn-crypto" style="margin-top:15px;" onclick="cerrarViewer()">Desconectar</button>
                    `;
                } else {
                    inside.innerHTML = `
                        <div style="font-size:0.8em; color:var(--magenta); font-weight:bold; margin-bottom:10px;">🚫 ARCHIVO BLOQUEADO</div>
                        <p style="font-size:0.9em; margin:20px 0;">Este nodo de memoria requiere un nivel más alto. Regresa cuando seas <b>Agente Nivel 2</b>.</p>
                        <button class="btn-crypto" onclick="cerrarViewer()">Entendido</button>
                    `;
                }
            }
        }

        function cerrarViewer() {
            document.getElementById('archive-viewer').style.display = 'none';
        }

        function verificarAcertijo() {
            let rta = document.getElementById('crypto-sol').value.trim().toLowerCase();
            // Respuesta del acertijo: El coco
            if(rta === "coco" || rta === "el coco") {
                s2_unlocked = true;
                localStorage.setItem('sentinel_s2', 'true');
                ganarXP(150); // Te da suficiente para subir a Nivel 2 de un golpe
                abrirStory(2);
            } else {
                alert("❌ ERROR DE CÓDIGO: Matriz corrupta. Intenta otra respuesta.");
            }
        }

        // SISTEMA DE NOTAS MODULARES ESTILO NOTION
        function renderNotas() {
            let cont = document.getElementById('notes-container');
            cont.innerHTML = "";
            notas.forEach(n => {
                let div = document.createElement('div');
                div.className = `note-block ${n.done ? 'done' : ''}`;
                div.innerHTML = `
                    <span>${n.text}</span>
                    <button class="btn-check" onclick="completarNota(${n.id})">${n.done ? '↩️' : '✓'}</button>
                `;
                cont.appendChild(div);
            });
        }

        function agregarNota() {
            let txt = document.getElementById('new-note-txt').value.trim();
            if(!txt) return;
            notas.push({ id: Date.now(), text: txt, done: false });
            localStorage.setItem('sentinel_notas', JSON.stringify(notas));
            document.getElementById('new-note-txt').value = "";
            ganarXP(15);
        }

        function completarNota(id) {
            notas = notas.map(n => {
                if(n.id === id) {
                    if(!n.done) ganarXP(30); // Da experiencia al completarla
                    n.done = !n.done;
                }
                return n;
            });
            localStorage.setItem('sentinel_notas', JSON.stringify(notas));
            actualizarHUD();
        }

        function fxCorazones() {
            for(let i=0; i<8; i++) {
                let h = document.createElement('div'); h.innerHTML = '⚡'; h.classList.add('heart-fx');
                h.style.left = (Math.random() * 80 + 10) + 'vw'; h.style.top = '80vh';
                h.style.setProperty('--rx', (Math.random() * 160 - 80) + 'px');
                document.body.appendChild(h); setTimeout(() => h.remove(), 1500);
            }
        }

        // Ejecutar al iniciar
        actualizarHUD();
    </script>
</body>
</html>
